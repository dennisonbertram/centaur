# Rate limiting configuration applied per customer deployment.
# These are enforced by Centaur's API, not by K8s.
#
# Apply as extraEnv in the Helm values:
#   --set "api.extraEnv.RATE_LIMIT_AGENT_TURNS_PER_HOUR=60"
#
# Or apply directly:
#   kubectl set env deployment/centaur-centaur-api -n centaur \
#     --containers=api \
#     RATE_LIMIT_AGENT_TURNS_PER_HOUR=60 \
#     RATE_LIMIT_SANDBOX_CONCURRENT=5 \
#     RATE_LIMIT_TOOL_CALLS_PER_HOUR=300

# --- Tier defaults ---
#
# Dev:
#   Agent turns: 30/hour
#   Concurrent sandboxes: 2
#   Tool calls: 100/hour
#
# Small:
#   Agent turns: 120/hour
#   Concurrent sandboxes: 10
#   Tool calls: 600/hour
#
# Prod:
#   Agent turns: 600/hour
#   Concurrent sandboxes: 50
#   Tool calls: 3000/hour
#
# These limits protect against runaway agents and abusive usage.
# Centaur's warm pool and execution queue enforce concurrency limits.
# Tool call limits are advisory — individual tools may have their own
# upstream rate limits (e.g. Composio: 20K calls/month on free tier).
